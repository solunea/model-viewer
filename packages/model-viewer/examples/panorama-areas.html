<!doctype html>
<meta charset="utf-8">
<title>Native panorama areas</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js"}}</script>
<style>body{font:16px sans-serif}model-viewer{width:90vw;height:70vh}.anchor{opacity:0;width:1px;height:1px}</style>
<model-viewer skybox-only camera-controls interaction-prompt="none"
  camera-orbit="0deg 90deg .001m" field-of-view="75deg"
  src="../../shared-assets/models/cube.gltf"
  skybox-image="../../shared-assets/environments/spruit_sunrise_1k_HDR.hdr">
  <button slot="hotspot-area" class="anchor" data-position="0 0 -10" data-normal="0 0 1" aria-label="Area: press Enter to open">Area</button>
</model-viewer>
<p id="status">Move over the centre of the panorama. A small hole remains inactive.</p>
<button id="poster">Download poster without highlight</button>
<script type="module">
import '../dist/model-viewer-module.min.js';
const viewer=document.querySelector('model-viewer'),status=document.querySelector('#status');
const width=256,height=128,bits=new Uint8Array(32*32/8);
for(let y=0;y<32;y++)for(let x=0;x<32;x++){
  if(x>=13&&x<19&&y>=13&&y<19)continue;
  const p=y*32+x;bits[p>>3]|=1<<(p&7);
}
viewer.setPanoramaAreas([{name:'hotspot-area',mask:{width,height,bounds:{x:48,y:48,width:32,height:32},bits}}]);
viewer.addEventListener('pointermove',event=>viewer.setPanoramaAreaHighlight(viewer.panoramaAreaFromPoint(event.clientX,event.clientY)?.name??null));
viewer.addEventListener('pointerleave',()=>viewer.setPanoramaAreaHighlight(null));
viewer.addEventListener('click',event=>{const hit=viewer.panoramaAreaFromPoint(event.clientX,event.clientY);if(hit)status.textContent=`${hit.name}: u=${hit.u.toFixed(3)}, v=${hit.v.toFixed(3)}`;});
const anchor=viewer.querySelector('button');
anchor.addEventListener('focus',()=>viewer.setPanoramaAreaHighlight(anchor.slot));
anchor.addEventListener('blur',()=>viewer.setPanoramaAreaHighlight(null));
anchor.addEventListener('click',()=>status.textContent='Area activated from its accessible native anchor.');
document.querySelector('#poster').addEventListener('click',async()=>{
  const url=URL.createObjectURL(await viewer.toBlob()),a=document.createElement('a');
  a.href=url;a.download='panorama-poster.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
});
</script>
